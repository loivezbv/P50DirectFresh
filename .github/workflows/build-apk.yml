name: P50 DIRECT TEST APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate current Android scaffold
        run: flutter create --platforms=android --org com.ddoolive --project-name p50_direct_fresh .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: P50-DIRECT-TEST-APK
          path: build/app/outputs/flutter-apk/app-release.apk
