name: P50 DIRECT TEST APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate current Android scaffold
        run: flutter create --platforms=android --org com.ddoolive --project-name p50_direct_fresh .
      - name: Install P50 native Android bridge
        run: |
          cp android/app/src/main/kotlin/com/ddoolive/p50direct/MainActivity.kt android/app/src/main/kotlin/com/ddoolive/p50_direct_fresh/MainActivity.kt
          sed -i 's/package com.ddoolive.p50direct/package com.ddoolive.p50_direct_fresh/' android/app/src/main/kotlin/com/ddoolive/p50_direct_fresh/MainActivity.kt
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: P50-DIRECT-TEST-APK
          path: build/app/outputs/flutter-apk/app-release.apk
